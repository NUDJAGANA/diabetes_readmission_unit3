<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1510" viewBox="0 0 1100 1510" role="img" aria-labelledby="title description">
  <title id="title">Diabetes Hospital Readmission Project Workflow</title>
  <desc id="description">Eight project phases from defining the audience and question through data review, preparation, analysis, dashboard development, testing, documentation, and ongoing maintenance. Ethical review applies throughout, and evaluation can lead to revisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#55718a"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#a46a2a"/>
    </marker>
    <style>
      .bg { fill: #f5f8fb; }
      .title { font: 700 34px Arial, sans-serif; fill: #19324a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #50677c; }
      .card { fill: #ffffff; stroke: #c9d6e2; stroke-width: 2; }
      .num { fill: #1f6078; }
      .numtext { font: 700 20px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .step { font: 700 20px Arial, sans-serif; fill: #19324a; }
      .detail { font: 15px Arial, sans-serif; fill: #42596e; }
      .arrow { stroke: #55718a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #a46a2a; stroke-width: 3; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrowLoop); }
      .ethicbox { fill: #e7f1f4; stroke: #87aeba; stroke-width: 2; }
      .ethictitle { font: 700 18px Arial, sans-serif; fill: #174b5d; }
      .ethictext { font: 15px Arial, sans-serif; fill: #315969; }
      .looplabel { font: 14px Arial, sans-serif; fill: #8a5723; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="1510" rx="24"/>
  <text class="title" x="70" y="72">Diabetes Hospital Readmission</text>
  <text class="title" x="70" y="112">Project Workflow</text>
  <text class="subtitle" x="70" y="148">A lifecycle plan with ethics checks throughout and evaluation feeding into future revisions</text>

  <!-- phase cards -->
  <g>
    <rect class="card" x="135" y="190" width="830" height="112" rx="16"/>
    <circle class="num" cx="188" cy="246" r="25"/><text class="numtext" x="188" y="247">1</text>
    <text class="step" x="235" y="235">Define the audience and question</text>
    <text class="detail" x="235" y="266">State the user need, project purpose, analysis questions and hypotheses.</text>

    <path class="arrow" d="M550 303 L550 324"/>
    <rect class="card" x="135" y="330" width="830" height="112" rx="16"/>
    <circle class="num" cx="188" cy="386" r="25"/><text class="numtext" x="188" y="387">2</text>
    <text class="step" x="235" y="375">Review the data source and permissions</text>
    <text class="detail" x="235" y="406">Record provenance, licence, dates, definitions, limitations and privacy risks.</text>

    <path class="arrow" d="M550 443 L550 464"/>
    <rect class="card" x="135" y="470" width="830" height="112" rx="16"/>
    <circle class="num" cx="188" cy="526" r="25"/><text class="numtext" x="188" y="527">3</text>
    <text class="step" x="235" y="515">Inspect and prepare the data</text>
    <text class="detail" x="235" y="546">Check fields, missingness, formats and transformations; validate prepared outputs.</text>

    <path class="arrow" d="M550 583 L550 604"/>
    <rect class="card" x="135" y="610" width="830" height="112" rx="16"/>
    <circle class="num" cx="188" cy="666" r="25"/><text class="numtext" x="188" y="667">4</text>
    <text class="step" x="235" y="655">Analyse and interpret</text>
    <text class="detail" x="235" y="686">Answer the project questions; explain uncertainty and avoid causal claims from association.</text>

    <path class="arrow" d="M550 723 L550 744"/>
    <rect class="card" x="135" y="750" width="830" height="112" rx="16"/>
    <circle class="num" cx="188" cy="806" r="25"/><text class="numtext" x="188" y="807">5</text>
    <text class="step" x="235" y="795">Build the dashboard and prediction flow</text>
    <text class="detail" x="235" y="826">Present charts, filters and explanations; align prediction inputs with the model.</text>

    <path class="arrow" d="M550 863 L550 884"/>
    <rect class="card" x="135" y="890" width="830" height="112" rx="16"/>
    <circle class="num" cx="188" cy="946" r="25"/><text class="numtext" x="188" y="947">6</text>
    <text class="step" x="235" y="935">Test, evaluate and gather feedback</text>
    <text class="detail" x="235" y="966">Check app interactions, usability, model performance and subgroup differences.</text>

    <path class="arrow" d="M550 1003 L550 1024"/>
    <rect class="card" x="135" y="1030" width="830" height="112" rx="16"/>
    <circle class="num" cx="188" cy="1086" r="25"/><text class="numtext" x="188" y="1087">7</text>
    <text class="step" x="235" y="1075">Document and publish responsibly</text>
    <text class="detail" x="235" y="1106">Keep sources, methods, limitations, ethics, reflection and setup instructions findable.</text>

    <path class="arrow" d="M550 1143 L550 1164"/>
    <rect class="card" x="135" y="1170" width="830" height="112" rx="16"/>
    <circle class="num" cx="188" cy="1226" r="25"/><text class="numtext" x="188" y="1227">8</text>
    <text class="step" x="235" y="1215">Maintain, update and re-evaluate</text>
    <text class="detail" x="235" y="1246">Review dependencies, outputs, data/model changes and ethical risks before releases.</text>
  </g>

  <!-- lifecycle feedback loop -->
  <path class="loop" d="M965 1226 C1030 1226 1045 1200 1045 1140 L1045 400 C1045 355 1015 350 970 350"/>
  <text class="looplabel" x="1018" y="815" transform="rotate(-90 1018 815)">If data or model changes, revisit data preparation and evaluation</text>
  <path class="loop" d="M135 946 C85 946 80 925 80 890 L80 800 C80 780 100 780 130 780"/>
  <text class="looplabel" x="60" y="865" transform="rotate(-90 60 865)">Use test findings to revise</text>

  <!-- ethics across all phases -->
  <rect class="ethicbox" x="135" y="1320" width="830" height="132" rx="16"/>
  <text class="ethictitle" x="170" y="1360">Ethical review runs throughout the project</text>
  <text class="ethictext" x="170" y="1392">Provenance and permission · privacy and data minimisation · fairness and representation</text>
  <text class="ethictext" x="170" y="1420">Accessible communication · uncertainty · social impact · responsible publication</text>
</svg>
